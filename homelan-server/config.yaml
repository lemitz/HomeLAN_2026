server:
  host: "0.0.0.0"          # Слушать все интерфейсы локальной сети
  port: 8080               # Порт HTTP и WebSocket

database:
  path: "./data/messages.db"

files:
  storage_path: "./data/files"
  max_file_mb: 2048        # Максимальный размер одного файла (МБ)
  quota_mb: 0              # Общий лимит хранилища файлов (МБ), 0 = без лимита (проверяется только свободное место)
  retention_days: 0        # Через сколько дней удалять файлы, 0 = хранить всегда

security:
  max_users: 2             # Сколько пользователей может зарегистрироваться
  max_devices_per_user: 3  # Сколько активных устройств у одного пользователя
  session_days: 90         # Срок жизни сессии (продлевается при использовании)
  # duress_password: ""    # Пароль принуждения (мин. 8 символов). При вводе на логине — экстренный вайп. Пусто = выключено.

timeouts:
  read_seconds: 300
  write_seconds: 300       # Для скачивания файлов дедлайн продлевается автоматически
  idle_seconds: 60

dead_man_switch:
  enabled: true            # Автовайп, если админ не появлялся timeout_days дней
  timeout_days: 30
