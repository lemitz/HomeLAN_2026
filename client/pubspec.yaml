name: homelan_client
description: HomeLAN Messenger - secure local network messenger
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Сеть
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  
  # Локальная БД
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.1
  
  # Состояние
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Утилиты
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path: ^1.8.3
  
  # Криптография
  cryptography: ^2.5.0
  
  # Файлы и медиа
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  mime: ^1.0.5
  
  # Уведомления
  flutter_local_notifications: ^17.0.0
  open_filex: ^4.7.0
  flutter_foreground_task: ^6.1.3
  
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  local_auth: ^2.2.0
  multicast_dns: ^0.3.2+6
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
