plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Ключ подписи релиза. Источники (по порядку):
//  1. переменные окружения (CI): HOMELAN_KEYSTORE_FILE, HOMELAN_KEYSTORE_PASSWORD,
//     HOMELAN_KEY_ALIAS, HOMELAN_KEY_PASSWORD — см. scripts/make-keystore.ps1;
//  2. android/key.properties (не коммитится): storeFile, storePassword, keyAlias, keyPassword.
// Без ключа релиз подписывается debug-ключом (только для домашнего теста).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (System.getenv("HOMELAN_KEYSTORE_FILE")) {
    keystoreProperties['storeFile'] = System.getenv("HOMELAN_KEYSTORE_FILE")
    keystoreProperties['storePassword'] = System.getenv("HOMELAN_KEYSTORE_PASSWORD")
    keystoreProperties['keyAlias'] = System.getenv("HOMELAN_KEY_ALIAS")
    keystoreProperties['keyPassword'] = System.getenv("HOMELAN_KEY_PASSWORD")
} else if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKey = keystoreProperties['storeFile'] != null
android {
    namespace "com.homelan.homelan_client"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.homelan.homelan_client"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
